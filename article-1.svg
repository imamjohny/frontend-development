<?xml version="1.0" encoding="UTF-8"?>
<!-- Decorative article illustration for baseline performance testing -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <title>Fast Rendering</title>
  <desc>Reduce blocking work and keep the first screen responsive.</desc>
  <rect width="1200" height="700" rx="36" fill="#e8eef7"/>
  <rect x="100" y="100" width="1000" height="500" rx="28" fill="#ffffff" stroke="#c7d2e3" stroke-width="6"/>
  <circle cx="260" cy="260" r="90" fill="#5b7cfa"/>
  <rect x="410" y="190" width="520" height="44" rx="12" fill="#183153"/>
  <rect x="410" y="270" width="430" height="28" rx="10" fill="#94a3b8"/>
  <rect x="410" y="325" width="360" height="28" rx="10" fill="#cbd5e1"/>
  <rect x="180" y="470" width="840" height="28" rx="10" fill="#dbe4f0"/>
  <text x="180" y="560" font-family="Arial" font-size="34" fill="#183153">Fast Rendering</text>
  <text x="180" y="595" font-family="Arial" font-size="20" fill="#52657a">Reduce blocking work and keep the first screen responsive.</text>
</svg>
